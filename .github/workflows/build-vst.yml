name: Build VST plugin

# Builds and tests the plugin on every push that touches vst/.
on:
  push:
    paths:
      - "vst/**"
      - ".github/workflows/build-vst.yml"
  pull_request:
    paths:
      - "vst/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Build and run the DSP self-test, then the plugin
        if: hashFiles('vst/CMakeLists.txt') != ''   # nothing to build until the plugin has its CMakeLists
        shell: bash
        run: |
          set -euo pipefail
          cmake -S vst -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          exe=$(find build -type f \( -iname "EngineTest" -o -iname "EngineTest.exe" \) | head -n1)
          if [ -n "$exe" ]; then "$exe"; fi

      - name: Upload build
        if: hashFiles('vst/CMakeLists.txt') != ''   # nothing to build until the plugin has its CMakeLists
        uses: actions/upload-artifact@v4
        with:
          name: egret-eq-${{ matrix.os }}
          path: build/*_artefacts/Release/**
          if-no-files-found: error
