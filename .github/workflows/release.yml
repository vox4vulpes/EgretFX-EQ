name: Release

# Push a tag like v1.0.0 to build Egret EQ on Windows, macOS and Linux and
# publish a GitHub release with a zip per platform and a Windows installer.
# Run it by hand (workflow_dispatch) to build everything as workflow
# artifacts without publishing, e.g. to try the installer.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the test installer"
        default: "0.0.0"

env:
  FX: egret-eq                  # folder name inside the zips
  PRETTY: Egret-EQ                    # file names: <PRETTY>-<version>-<platform>.zip
  APP_NAME: Egret EQ
  APP_KEY: EgretEQ                     # fixed installer AppId

jobs:
  # Fail fast, before the long builds, if CHANGELOG.md has no entry for this tag.
  changelog:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/changelog-section.sh "$GITHUB_REF_NAME"

  build:
    needs: changelog
    # Manual test builds skip the changelog check (it's skipped, not failed).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Build, test and package
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          platform=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          version=${VERSION#v}
          mkdir -p dist "stage/$FX"

          cmake -S vst -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

          test_exe=$(find build -type f \( -iname "EngineTest" -o -iname "EngineTest.exe" \) | head -n1)
          if [ -n "$test_exe" ]; then "$test_exe"; fi

          artefacts=$(find build -type d -path "*_artefacts/Release" | head -n1)
          cp -R "$artefacts/VST3" "stage/$FX/"
          # MSVC drops import libs next to the .vst3; they're build leftovers.
          find "stage/$FX/VST3" -maxdepth 1 \( -name '*.lib' -o -name '*.exp' \) -delete
          if [ -d "$artefacts/Standalone" ]; then cp -R "$artefacts/Standalone" "stage/$FX/"; fi
          cp LICENSE "stage/$FX/LICENSE.txt"

          (cd stage && cmake -E tar cf "../dist/$PRETTY-$version-$platform.zip" --format=zip "$FX")

          if [ "$RUNNER_OS" = "Windows" ]; then
            bash installer/windows/build-installer.sh "$version" stage dist "$APP_NAME" "$APP_KEY" "$PRETTY-Setup-$version"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## What's new"
            echo
            bash .github/scripts/changelog-section.sh "$GITHUB_REF_NAME"
            echo
          } > notes.md

          cat >> notes.md <<'NOTES'
          ## Downloads

          - **`Egret-EQ-Setup-<version>.exe`** — Windows installer (recommended on Windows)
          - **`Egret-EQ-<version>-<platform>.zip`** — the VST3 plugin and the standalone app

          Every Egret effect in one download: [Egret FX Bundle](https://github.com/vox4vulpes/EgretFX/releases/latest).

          ## Install

          **Windows:** run the installer. It puts the plugin in `C:\Program Files\Common Files\VST3\Egret`,
          adds the standalone app to the Start menu, and upgrades an existing install in place.
          It shares that folder with the Egret FX Bundle installer, so having both never shows the
          plugin twice. Windows SmartScreen may warn because the installer isn't code-signed:
          choose **More info -> Run anyway**.

          **Manual install:** copy the `.vst3` folder/file into your plugin folder and rescan in your DAW:

          | Platform | VST3 folder |
          |---|---|
          | Windows | `C:\Program Files\Common Files\VST3` |
          | macOS | `~/Library/Audio/Plug-Ins/VST3` |
          | Linux | `~/.vst3` |

          macOS builds are not signed or notarized. If macOS refuses to load them, run
          `xattr -dr com.apple.quarantine "<path to the .vst3 or .app>"` once.
          NOTES

          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME $GITHUB_REF_NAME" \
            --notes-file notes.md
